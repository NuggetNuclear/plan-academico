var(--sub);padding:12px 15px;border-radius:10px;margin-bottom:20px;font-size:13px}#planner-preview .bottom-nav{display:none}#planner-preview .overlay{position:absolute;inset:0;background:rgba(10,12,20,.55);z-index:4}#planner-preview .overlay[hidden]{display:none}#planner-preview .drawer{width:min(320px,90%);min-height:100%;background:var(--surface);padding:20px 14px}#planner-preview .drawer-top{display:flex;justify-content:space-between;align-items:center;padding:2px 10px 10px}#planner-preview .drawer-top button{background:transparent;border:0;color:var(--text);font-size:18px;width:44px;height:44px}#planner-preview .mobile{max-width:390px;margin:auto;min-height:720px}#planner-preview .mobile .sidebar{display:none}#planner-preview .mobile .topbar{padding:0 18px;height:60px}#planner-preview .mobile .brand-mobile{display:inline}#planner-preview .mobile .period{display:none}#planner-preview .mobile .content{padding:27px 18px 95px}#planner-preview .mobile h1{font-size:23px}#planner-preview .mobile .page-head{display:block}#planner-preview .mobile .page-head>.button{margin-top:16px}#planner-preview .mobile .next{align-items:flex-start;flex-wrap:wrap}#planner-preview .mobile .next .button{width:100%}#planner-preview .mobile .overview{grid-template-columns:1fr 1fr}#planner-preview .mobile .bottom-nav{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px}#planner-preview .mobile .bottom-nav button{border:0;background:transparent;color:var(--muted);font-size:11px;min-width:60px;min-height:52px;padding:3px}#planner-preview .mobile .bottom-nav button span{display:block;font-size:18px;margin-bottom:3px}#planner-preview .mobile .bottom-nav button[aria-current=page]{color:var(--accent);font-weight:700}#planner-preview .mobile .course{flex-wrap:wrap}#planner-preview .mobile .course .button{width:100%}@media(max-width:700px){#planner-preview .app-shell:not(.mobile) .sidebar{width:180px}#planner-preview .content{padding:28px 20px 50px}#planner-preview .next{flex-wrap:wrap}}@media(max-width:500px){#planner-preview .app-shell:not(.mobile) .sidebar{display:none}#planner-preview .app-shell:not(.mobile) .bottom-nav{display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line)}#planner-preview .app-shell:not(.mobile) .bottom-nav button{background:transparent;border:0;color:var(--muted);font-size:11px;min-height:54px}#planner-preview .app-shell:not(.mobile) .bottom-nav button span{display:block;font-size:18px}#planner-preview .overview{grid-template-columns:1fr 1fr}#planner-preview .next .button{width:100%}}

<script>
(()=>{const root=document.getElementById('planner-preview'),shell=root.querySelector('.app-shell'),content=root.querySelector('#content'),overlay=root.querySelector('.overlay');let page='Inicio',previous='Inicio',menuTrigger=null,undo=null,notice='',draft='';const courses=[{name:'Cálculo II',evals:[{name:'Control 1',value:5.4},{name:'Prueba 2',value:null}]},{name:'Programación',evals:[{name:'Proyecto 1',value:6.1},{name:'Control 2',value:null}]},{name:'Física I',evals:[{name:'Laboratorio 1',value:5.8},{name:'Prueba 1',value:null}]}];let ci=0,ei=1;const groups=[['Día a día',[['house','Inicio'],['notebook-pen','Notas'],['calendar-days','Agenda']]],['Mi carrera',[['network','Mi malla'],['calendar-range','Plan de carrera'],['flask-conical','Simulaciones'],['chart-no-axes-column','Estadísticas']]],['Utilidades',[['settings','Configuración'],['circle-help','Ayuda'],['circle-user','Mi cuenta']]]];const fmt=n=>n.toFixed(1).replace('.',',');const average=c=>{const v=c.evals.map(e=>e.value).filter(v=>v!==null);return v.length?fmt(v.reduce((a,b)=>a+b,0)/v.length):'Sin notas'};const pending=c=>c.evals.filter(e=>e.value===null).length;function nav(){return '<div class="logo"><span class="logo-mark"><i data-lucide="graduation-cap" aria-hidden="true"></i></span> Notas</div>'+groups.map(g=>'<div class="nav-group">'+g[0]+'</div>'+g[1].map(x=>'<button type="button" class="nav-item" data-page="'+x[1]+'" '+(page===x[1]?'aria-current="page"':'')+'><span class="nav-icon" aria-hidden="true"><i data-lucide="'+x[0]+'"></i></span>'+x[1]+'</button>').join('')).join('')};function bottom(){return [['house','Inicio'],['notebook-pen','Notas'],['calendar-days','Agenda'],['menu','Menú']].map(x=>'<button type="button" '+(x[1]==='Menú'?'data-menu':'data-page="'+x[1]+'"')+' '+(page===x[1]?'aria-current="page"':'')+'><span aria-hidden="true"><i data-lucide="'+x[0]+'"></i></span>'+x[1]+'</button>').join('')};function rows(){return courses.map((c,i)=>'<div class="course"><div class="course-info"><h3>'+c.name+'</h3><p class="meta">'+pending(c)+' evaluación'+(pending(c)===1?'':'es')+' pendiente'+(pending(c)===1?'':'s')+'</p></div><div class="course-value">'+average(c)+'<small>Promedio parcial</small></div><button type="button" class="button" data-register="'+i+'">Registrar nota</button></div>').join('')};function render(focus=false){root.querySelector('.sidebar').innerHTML=nav();root.querySelector('.drawer-nav').innerHTML=nav();root.querySelector('.bottom-nav').innerHTML=bottom();let html='';const feedback=notice?'<div class="notice" role="status"><span>'+notice+'</span><button type="button" class="button link" data-undo>Deshacer</button></div>':'';if(page==='Inicio'){html=feedback+'<div class="page-head"><div><h1>Tu semestre, de un vistazo</h1><p class="subhead">Revisa lo que viene y mantén tus notas al día.</p></div></div><div class="section-head"><h2>Evaluación destacada</h2><span>Este semestre</span></div><div class="panel next"><div class="date">NOV<b>12</b></div><div class="next-info"><h3>Prueba 2</h3><p class="meta">Cálculo II · Jueves 12 de noviembre · '+(courses[0].evals[1].value===null?'Pendiente':'Nota registrada: '+fmt(courses[0].evals[1].value))+'</p></div>'+(courses[0].evals[1].value===null?'<button type="button" class="button primary" data-register="0">Registrar nota</button>':'<button type="button" class="button" data-page="Notas">Ver notas</button>')+'</div><div class="section-head"><h2>Resumen del semestre</h2><button class="button link" type="button" data-page="Notas">Ver notas →</button></div><div class="overview"><div class="panel metric"><div><small>Ramos en curso</small><strong>3</strong></div></div><div class="panel metric"><div><small>Evaluaciones pendientes</small><strong>'+courses.reduce((n,c)=>n+pending(c),0)+'</strong></div></div></div><div class="section-head"><h2>Mis ramos</h2><span>Promedio parcial · igual peso por nota</span></div><div class="panel course-list">'+rows()+'</div>'}else if(page==='Notas'){html='<div class="page-head"><div><h1>Notas</h1><p class="subhead">Segundo semestre 2026 · Selecciona un ramo para registrar una nota.</p></div></div>'+feedback+'<div class="section-head"><h2>Ramos en curso</h2><span>Promedio parcial · igual peso por nota</span></div><div class="panel course-list">'+rows()+'</div>'}else if(page==='Registro'){const c=courses[ci];html='<button class="back" type="button" data-back>← Volver a '+previous+'</button><div class="page-head"><div><h1>Registrar nota</h1><p class="subhead">Segundo semestre 2026 · Completa el resultado de una evaluación.</p></div></div><form class="panel form-panel" novalidate><label for="course-select">Ramo</label><select id="course-select">'+courses.map((x,i)=>'<option value="'+i+'" '+(i===ci?'selected':'')+'>'+x.name+'</option>').join('')+'</select><label for="evaluation-select">Evaluación</label><select id="evaluation-select">'+c.evals.map((x,i)=>'<option value="'+i+'" '+(i===ei?'selected':'')+'>'+x.name+(x.value===null?' · Pendiente':' · '+fmt(x.value))+'</option>').join('')+'</select><label for="grade-input">Nota</label><input id="grade-input" inputmode="decimal" autocomplete="off" value="'+draft.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+'" aria-describedby="grade-hint grade-error"><p class="hint" id="grade-hint">Ingresa un valor entre 1,0 y 7,0. Puedes usar coma o punto.</p><p class="error" id="grade-error" role="alert"></p><div class="form-actions"><button class="button primary" type="button" data-save>Guardar nota</button><button class="button" type="button" data-back>Cancelar</button></div></form>'}else{html='<div class="page-head"><div><h1>'+page+'</h1><p class="subhead">Esta sección está considerada en la propuesta.</p></div></div><div class="panel"><h2>Vista aún no disponible</h2><p class="subhead">En este prototipo puedes explorar Inicio, Notas y el registro de una evaluación.</p><button type="button" class="button" style="margin-top:18px" data-page="Inicio">Ir a Inicio</button></div>'}content.innerHTML=html;if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});if(focus){const h=content.querySelector('h1');h.setAttribute('tabindex','-1');h.focus()}}function go(p){page=p;render(true)}function closeMenu(returnFocus=true){overlay.hidden=true;root.querySelector('.sidebar').inert=false;root.querySelector('.app-main').inert=false;if(returnFocus&&menuTrigger)menuTrigger.focus()}function register(index){previous=page==='Registro'?previous:page;ci=index;ei=Math.max(0,courses[ci].evals.findIndex(e=>e.value===null));draft=courses[ci].evals[ei].value===null?'':fmt(courses[ci].evals[ei].value);page='Registro';render(true)}root.addEventListener('click',e=>{if(e.target===overlay){closeMenu();return}const b=e.target.closest('button');if(!b)return;if(b.dataset.size){shell.classList.toggle('mobile',b.dataset.size==='mobile');root.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}else if(b.id==='theme-toggle'){let dark=shell.dataset.theme!=='dark';shell.dataset.theme=dark?'dark':'light';b.textContent=dark?'Tema claro':'Tema oscuro'}else if(b.hasAttribute('data-menu')){menuTrigger=b;root.querySelector('.sidebar').inert=true;root.querySelector('.app-main').inert=true;overlay.hidden=false;overlay.querySelector('[data-close]').focus()}else if(b.hasAttribute('data-close'))closeMenu();else if(b.dataset.page){if(!overlay.hidden)closeMenu(false);go(b.dataset.page)}else if(b.dataset.register!==undefined)register(Number(b.dataset.register));else if(b.hasAttribute('data-back'))go(previous);else if(b.hasAttribute('data-save'))saveGrade();else if(b.hasAttribute('data-undo')&&undo){courses[undo.ci].evals[undo.ei].value=undo.value;notice='';undo=null;render(true)}});root.addEventListener('change',e=>{if(e.target.id==='course-select'){ci=Number(e.target.value);ei=Math.max(0,courses[ci].evals.findIndex(x=>x.value===null));draft=courses[ci].evals[ei].value===null?'':fmt(courses[ci].evals[ei].value);render();content.querySelector('#course-select').focus()}if(e.target.id==='evaluation-select'){ei=Number(e.target.value);draft=courses[ci].evals[ei].value===null?'':fmt(courses[ci].evals[ei].value);content.querySelector('#grade-input').value=draft;content.querySelector('#grade-error').textContent='';content.querySelector('#grade-input').removeAttribute('aria-invalid')}});root.addEventListener('input',e=>{if(e.target.id==='grade-input')draft=e.target.value});function saveGrade(){const input=content.querySelector('#grade-input'),s=input.value.trim().replace(',','.');if(!/^(?:[1-6](?:\.\d+)?|7(?:\.0+)?)$/.test(s)){content.querySelector('#grade-error').textContent='Ingresa una nota válida entre 1,0 y 7,0.';input.setAttribute('aria-invalid','true');input.focus();return}const value=Number(s);undo={ci,ei,value:courses[ci].evals[ei].value};courses[ci].evals[ei].value=value;notice='Nota '+fmt(value)+' guardada en '+courses[ci].name+' · '+courses[ci].evals[ei].name+'.';page=previous;render(true)}root.addEventListener('submit',e=>e.preventDefault());root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='grade-input'){e.preventDefault();saveGrade();return}if(overlay.hidden)return;if(e.key==='Escape'){e.preventDefault();closeMenu()}if(e.key==='Tab'){const items=[...overlay.querySelectorAll('button')];const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){shell.dataset.theme='dark';root.querySelector('#theme-toggle').textContent='Tema claro'}render()})();
</script>
